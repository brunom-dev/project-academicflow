version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: projeto_academico_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: brum
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: academic
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: